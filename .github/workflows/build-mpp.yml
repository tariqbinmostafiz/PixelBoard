name: Build MPP
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: chmod +x pixelboard-patches/gradlew
      - name: Build .mpp
        working-directory: pixelboard-patches
        run: ./gradlew :patches:buildAndroid --stacktrace
      - name: Tests (informational)
        if: always()
        continue-on-error: true
        working-directory: pixelboard-patches
        run: ./gradlew test --continue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixelboard-rambler-mpp
          path: pixelboard-patches/patches/build/libs/*.mpp
